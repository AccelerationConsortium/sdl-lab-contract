[project]
name = "sdl-lab-contract"
# Versioned in LOCKSTEP with docs/STATUS_SPEC.md in ac-organic-lab:
# major.minor == the spec revision these types mirror (1.2 == spec v1.2);
# the patch digit is free for packaging fixes that do not change the wire
# contract. Bumping minor REQUIRES a merged spec change first (spec ships
# before code — ac-organic-lab ARCHITECTURE.md decision #8).
version = "1.2.0"
description = "STATUS_SPEC device-contract types for the AC Organic Self-Driving Lab (Pydantic models shared by device repos and the lab-skills SDK)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yang Cao" }]
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdl_lab_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
